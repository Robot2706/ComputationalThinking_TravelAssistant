<!DOCTYPE html>
<html lang ="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2rism</title>
    
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/chatbot.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <script type="module" src="../js/chatbot.js" defer></script>
</head>
<body>
    <div class="background-main"></div>
    
    <div class="mainmenu-container" id="menuScreen" style="display: none;">
        </div>
    
    <div class="results-screen" id="resultsScreen" style="display: flex;">
        <div class="main-content-wrapper">
            <header class="ai-header">
                <img src="../assets/icons/logo.svg" alt="2rism Logo" class="header-logo">
                <i class="fas fa-home home-icon"></i> <i class="fas fa-chevron-down dropdown-icon"></i> 
            </header>

            <!-- AI MESSAGE -->
            <div class="ai-message-box paragraph200regular" id="aiMessage">
                XIN CHÀO, TÔI LÀ TRỢ LÝ DU LỊCH 2RISM. BẠN MUỐN TÔI GIÚP GÌ CHO BẠN HÔM NAY?            
            </div>

            <!-- ASK BAR -->
            <div class="ask-bar-container">
                <input type="text" placeholder="Ask something..." class="ask-input" id="askInput">
            </div>
        </div>
    </div>
</body>
</html>
