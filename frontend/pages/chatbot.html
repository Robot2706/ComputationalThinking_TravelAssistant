<!DOCTYPE html>
<html lang ="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2rism</title>
    
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/chatbot.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <script type="module" src="../js/chatbot.js" defer></script>
</head>

<body>
    <!-- BACKGROUND -->
    <div class="background-main"></div>

    <div class="main-content-wrapper">

        <!-- HEADER -->
        <header class="ai-header">
            <img src="../assets/icons/logo.svg" class="header-logo" />
            <i class="fas fa-home home-icon"></i>
            <i class="fas fa-chevron-down dropdown-icon"></i>
        </header>

        <!-- AI MESSAGE -->
        <h1 class="ai-message">
            Hello there, what can I help you with today?
        </h1>

        <!-- ASK BAR -->
        <div class="ask-bar-container">
            <input type="text" class="ask-input" placeholder="Ask something..." />
        </div>

    </div>

</body>
</html>
