<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2rism - Sign Up</title>

    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/fonts.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      .error-message,
      .success-message {
        font-family: "Poppins", sans-serif;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 8px;
        display: none;
        font-size: 14px;
      }
      .error-message {
        font-family: "Poppins", sans-serif;
        background-color: #ffe0e0;
        color: #d63031;
        border: 1px solid #d63031;
      }
      .success-message {
        font-family: "Poppins", sans-serif;
        background-color: #e0ffe0;
        color: #27ae60;
        border: 1px solid #27ae60;
      }
    </style>
  </head>
  <body>
    <div class="background-login"></div>

    <div class="border">
      <div class="fonts-upper">Create an account</div>
      <div class="fonts-lower">
        Already have an account?
        <a href="login.html" class="link-underline">Log in</a>
      </div>

      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      <div class="textbox-border">
        <div class="textbox-contents-border">
          <div class="fonts-textbox">User name</div>
          <input
            type="text"
            id="signup-name"
            class="text-box"
            placeholder="Enter your name"
          />
        </div>

        <div class="textbox-contents-border">
          <div class="fonts-textbox">Email address</div>
          <input
            type="email"
            id="signup-email"
            class="text-box"
            placeholder="Enter your email"
          />
        </div>

        <div class="textbox-contents-border">
          <div class="label-input">
            <div class="fonts-textbox">Password</div>
            <div class="hide-group" id="hide-toggle">
              <img src="../assets/icons/hide.svg" alt="Hide Password" />
              <div class="fonts-textbox" style="cursor: pointer">Hide</div>
            </div>
          </div>
          <input
            type="password"
            id="signup-password"
            class="text-box"
            placeholder="Enter your password"
          />
          <p class="fonts-textbox-lower">
            Use 8 or more characters with a mix of letters, numbers & symbols
          </p>
        </div>

        <div class="textbox-contents-border">
          <div
            class="login-google-border"
            id="google-signup-btn"
            style="cursor: pointer"
          >
            <div class="google">
              <img src="../assets/icons/googleaccount.svg" alt="Google" />
              <div class="fonts-google">Continue with Google</div>
            </div>
          </div>
        </div>

        <div class="textbox-contents-border">
          <div
            class="create-account-border"
            id="signup-btn"
            style="cursor: pointer"
          >
            <div class="fonts-create-account">Create an account</div>
          </div>
        </div>

        <div class="textbox-contents-border">
          <p class="fonts-textbox">
            By creating an account, you agree to our
            <a href="#" class="link-underline">Terms of use</a> and
            <a href="#" class="link-underline">Privacy Policy</a>
          </p>
        </div>
      </div>
    </div>

    <!-- Module Scripts -->
    <script type="module">
      import { signupWithEmail, loginWithGoogle, togglePasswordVisibility } from '../js/auth.js';

      document.addEventListener("DOMContentLoaded", function () {
        const signupBtn = document.getElementById("signup-btn");
        const googleSignupBtn = document.getElementById("google-signup-btn");
        const nameInput = document.getElementById("signup-name");
        const emailInput = document.getElementById("signup-email");
        const passwordInput = document.getElementById("signup-password");
        const hideToggle = document.getElementById("hide-toggle");
        const hideText = hideToggle.querySelector(".fonts-textbox");

        // Toggle password visibility
        hideToggle.addEventListener("click", () => {
          togglePasswordVisibility(passwordInput, hideText);
        });

        // Signup button click
        signupBtn.addEventListener("click", () => {
          const name = nameInput.value.trim();
          const email = emailInput.value.trim();
          const password = passwordInput.value;

          if (!name || !email || !password) {
            showError("Please fill in all fields");
            return;
          }

          if (password.length < 8) {
            showError("Password must be at least 8 characters");
            return;
          }

          signupBtn.style.opacity = "0.6";
          signupBtn.style.pointerEvents = "none";
          signupBtn.querySelector(".fonts-create-account").textContent =
            "Creating account...";

          signupWithEmail(email, password, name)
            .then((result) => {
              if (result && result.success) {
                // Show success message
                window.showSuccess("✓ Account created successfully! You can now log in.");
                // Clear form
                nameInput.value = "";
                emailInput.value = "";
                passwordInput.value = "";
                confirmPasswordInput.value = "";
              }
            })
            .catch(() => {
              signupBtn.style.opacity = "1";
              signupBtn.style.pointerEvents = "auto";
              signupBtn.querySelector(".fonts-create-account").textContent =
                "Create an account";
            });
        });        // Google signup button click
        googleSignupBtn.addEventListener("click", () => {
          googleSignupBtn.style.opacity = "0.6";
          googleSignupBtn.style.pointerEvents = "none";

          const resetBtn = () => {
            googleSignupBtn.style.opacity = "1";
            googleSignupBtn.style.pointerEvents = "auto";
          };

          loginWithGoogle()
            .catch((error) => {
              // Chỉ reset nút, không show lỗi khi user hủy
              if (error.message === 'cancelled') {
                // Silent cancel, just reset button
              } else {
                showError(error.message);
              }
              resetBtn();
            });

          // Timeout safety: reset nút sau 5 giây nếu chưa reset
          setTimeout(resetBtn, 5000);
        });

        // Enter key to signup
        passwordInput.addEventListener("keypress", (e) => {
          if (e.key === "Enter") {
            signupBtn.click();
          }
        });

        // Error message function
        window.showError = function(message) {
          const errorDiv = document.getElementById("error-message");
          if (errorDiv) {
            errorDiv.textContent = message;
            errorDiv.style.display = "block";
            setTimeout(() => {
              errorDiv.style.display = "none";
            }, 5000);
          }
        };

        // Success message function
        window.showSuccess = function(message) {
          const successDiv = document.getElementById("success-message");
          if (successDiv) {
            successDiv.textContent = message;
            successDiv.style.display = "block";
            setTimeout(() => {
              successDiv.style.display = "none";
            }, 10000);
          }
        };
      });
    </script>
  </body>
</html>
