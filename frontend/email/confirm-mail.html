<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2rism - Confirm Your Email</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #f4f4f4;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div data-layer="✉️ Emailify Template" class="EmailifyTemplate" style="width: 600px; background: white; overflow: hidden; flex-direction: column; justify-content: flex-start; align-items: flex-start; display: inline-flex">
  <div data-layer="🚣 Logo Text Right (Row For Content Columns)" class="LogoTextRightRowForContentColumns" style="align-self: stretch; padding-left: 24px; padding-right: 24px; padding-top: 16px; padding-bottom: 16px; background: black; justify-content: flex-start; align-items: center; gap: 16px; display: inline-flex">
    <div data-layer="logo" class="Logo" style="justify-content: flex-start; align-items: flex-start; gap: 4px; display: flex">
        <img data-layer="📷 Image" class="Image" style="width: px; height: 24px; object-fit: cover; object-position: center center" src="../assets/icons/logo.svg" />
    </div>
  </div>
  <div data-layer="🚣 Title, Text & Button (Row For Content Columns)" class="TitleTextButtonRowForContentColumns" style="align-self: stretch; padding-left: 84px; padding-right: 84px; padding-top: 74px; padding-bottom: 74px; background: black; justify-content: flex-start; align-items: center; gap: 16px; display: inline-flex">
    <div data-layer="🏛️ Column (For Content Elements)" class="ColumnForContentElements" style="flex: 1 1 0; overflow: hidden; flex-direction: column; justify-content: center; align-items: center; gap: 20px; display: inline-flex">
      <div data-layer="✍️ Text" class="Text" style="align-self: stretch; text-align: center; color: white; font-size: 45px; font-family: Poppins; font-weight: 400; line-height: 54.45px; word-wrap: break-word">Welcome to 2rism</div>
      <div data-layer="✍️ Text" class="Text" style="align-self: stretch; text-align: center; color: #777777; font-size: 20px; font-family: Poppins; font-weight: 400; line-height: 30px; word-wrap: break-word">travel with us, travel with trust</div>
      <div data-layer="📐 Spacer" class="Spacer" style="align-self: stretch; height: 4px; position: relative; background: rgba(255, 255, 255, 0)"></div>
      <a href="%LINK%" style="text-decoration: none;">
        <div data-layer="🔗 Button" class="Button" style="padding-left: 64px; padding-right: 64px; padding-top: 12px; padding-bottom: 12px; background: #EFEFEF; overflow: hidden; border-radius: 8px; justify-content: center; align-items: center; gap: 8px; display: inline-flex; cursor: pointer;">
          <div data-layer="✍️ Learn More" class="LearnMore" style="text-align: center; color: black; font-size: 14px; font-family: Poppins; font-weight: 400; word-wrap: break-word">Confirm your account</div>
        </div>
      </a>
    </div>
  </div>
  <img data-layer="📷 Image" class="Image" style="width: 600px; height: 485.58px; object-fit: cover; object-position: center center; background: #C4C4C4" src="../assets/images/hcmc.jpg" />
  <div data-layer="🚣 Footer Unsubscribe (Row For Content Columns)" class="FooterUnsubscribeRowForContentColumns" style="align-self: stretch; padding-left: 32px; padding-right: 32px; padding-top: 26px; padding-bottom: 26px; background: black; justify-content: flex-start; align-items: center; gap: 16px; display: inline-flex">
    <div data-layer="🏛️ Column (For Content Elements)" class="ColumnForContentElements" style="flex: 1 1 0; overflow: hidden; flex-direction: column; justify-content: center; align-items: center; gap: 8px; display: inline-flex">
      <div data-layer="➖ Divider" class="Divider" style="align-self: stretch; height: 1px; background: #CCCCCC"></div>
      <div data-layer="📐 Spacer" class="Spacer" style="align-self: stretch; height: 16px; position: relative; background: rgba(255, 255, 255, 0)"></div>
      <div data-layer="🍔 Navigation" class="Navigation" style="overflow: hidden; justify-content: center; align-items: center; gap: 8px; display: inline-flex">
        <a href="https://2rism.com" style="text-decoration: none;">
          <div data-layer="🔗 Link" class="Link" style="text-align: center; color: #9F9F9F; font-size: 12px; font-family: Poppins; font-weight: 400; text-decoration: underline; word-wrap: break-word; cursor: pointer;">Visit our website</div>
        </a>
      </div>
      <div data-layer="📐 Spacer" class="Spacer" style="align-self: stretch; height: 16px; position: relative; background: rgba(255, 255, 255, 0)"></div>
    </div>
  </div>
</div>
</body>
